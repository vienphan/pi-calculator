<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Visualizer Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col items-center min-h-screen p-6">
  <h1 class="text-3xl font-bold text-blue-700 mt-4 mb-2">π Visualizer Lab</h1>
  <p class="text-gray-600 text-center max-w-lg mb-6">
    Watch how π can be approximated using a unit circle divided into equal angles.  
    Drag the slider or click "Auto Run" to see how π converges to 3.1416.
  </p>

  <!-- Control panel -->
  <div class="bg-white rounded-2xl shadow-lg p-6 w-full max-w-md text-center">
    <label class="block text-gray-700 font-medium mb-2">Angle α (degrees)</label>
    <input type="range" id="alphaSlider" min="1" max="60" value="10" step="1"
      class="w-full cursor-pointer accent-blue-600" oninput="updateSlider(this.value)">
    <p class="mt-2">α = <span id="alphaValue">10</span>°</p>

    <div class="flex justify-center gap-3 mt-4">
      <button onclick="calculatePiOnce()"
        class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 py-2">
        Calculate Once
      </button>
      <button onclick="autoRunSimulation()"
        class="bg-green-600 hover:bg-green-700 text-white rounded-lg px-4 py-2">
        Auto Run
      </button>
      <button onclick="resetSimulation()"
        class="bg-gray-400 hover:bg-gray-500 text-white rounded-lg px-4 py-2">
        Reset
      </button>
    </div>

    <p id="result" class="mt-4 text-lg font-semibold text-blue-700"></p>
  </div>

  <!-- Charts -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-10 w-full max-w-5xl">
    <div class="bg-white shadow-lg rounded-2xl p-4">
      <canvas id="piChart" height="150"></canvas>
    </div>
    <div class="bg-white shadow-lg rounded-2xl p-4">
      <canvas id="errorChart" height="150"></canvas>
    </div>
  </div>

  <!-- Circle canvas -->
  <div class="mt-10">
    <canvas id="circleCanvas" width="300" height="300"></canvas>
  </div>

  <footer class="mt-12 text-sm text-gray-500">
    Made with ❤️ by <a href="https://github.com/your-username" class="text-blue-600">your-username</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
